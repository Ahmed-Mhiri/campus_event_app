version: '3.8'

services:
  backend-main:
    build:
      context: ./backend-main
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend-main:/app
      - ~/.m2:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    command: mvn spring-boot:run
    ports:
      - "8081:8081"

  backend-asta:
    build:
      context: ./backend-asta
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend-asta:/app
      - ~/.m2:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    command: mvn spring-boot:run
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8081   # adjust if needed
    command: npm run dev -- --host 0.0.0.0