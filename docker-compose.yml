version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mystudyapp-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mystudyapp-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  backend-asta:
    build:
      context: ./backend-asta
    container_name: mystudyapp-backend-asta
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      ASTA_SERVER_PORT: 8082
      MQTT_HOST: mosquitto
      # (no DB needed, but keep for safety)
    depends_on:
      mosquitto:
        condition: service_started
    restart: unless-stopped

  backend-main:
    build:
      context: ./backend-main
    container_name: mystudyapp-backend-main
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      MQTT_HOST: mosquitto
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: mystudyapp-frontend
    ports:
      - "80:80"   # maps to host port 80 (you can change to 3000:80 if port 80 is taken)
    depends_on:
      - backend-main
      - backend-asta
    restart: unless-stopped

volumes:
  postgres_data: